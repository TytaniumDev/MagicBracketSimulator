name: Sync API Secrets

# Copies the API's secrets from Doppler (the source of truth) into GCP Secret
# Manager, where Firebase App Hosting reads them. Every secret referenced in
# api/apphosting.yaml is synced from the Doppler key named after its variable
# (e.g. RESEND_API_KEY -> resend-api-key). See scripts/sync-api-secrets.js.
#
# Run after changing an API secret in Doppler:
#   gh workflow run sync-api-secrets.yml
# App Hosting picks up the new values on its next rollout (next merge to
# main, or a new rollout from the Firebase console).

on:
  workflow_dispatch:

concurrency:
  group: sync-api-secrets
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Doppler -> GCP Secret Manager
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Load GCP credentials from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: ./scripts/load-doppler-secrets.sh GCP_SA_KEY

      - name: Extract GCP project ID from SA key
        id: project
        env:
          SA_KEY: ${{ env.GCP_SA_KEY }}
        run: ./scripts/extract-gcp-project.sh

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Sync secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GOOGLE_CLOUD_PROJECT: ${{ steps.project.outputs.project_id }}
        run: doppler secrets download --no-file --format json | node scripts/sync-api-secrets.js
