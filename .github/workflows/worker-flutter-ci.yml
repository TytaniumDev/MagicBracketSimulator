# Presubmit for the Flutter desktop worker (worker_flutter/).
#
# The main CI workflow only covers api/ and frontend/, so this runs the
# worker's analyzer and unit tests on every PR that touches it.
#
# Native Windows and macOS builds are not run here: they took 10 and 20+
# minutes per PR and rarely found anything the Dart tests didn't. The
# release workflow (release-worker.yml) builds and signs both on every push
# to main, so a native break shows up there as a failed release.
name: Worker Flutter CI

on:
  pull_request:
    branches: [main]
    paths:
      - "worker_flutter/**"
      - ".github/workflows/worker-flutter-ci.yml"

concurrency:
  group: worker-flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Worker Flutter / Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - run: flutter test

